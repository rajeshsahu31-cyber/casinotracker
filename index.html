<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#071a31">
<link rel="manifest" href="manifest.json">
<title>Cycle Tracker</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="app">
<header>
  <button class="topbtn" id="menuBtn">☰</button>
  <div class="title"><b>Cycle Tracker</b><span>Quick Dashboard</span></div>
  <button class="topbtn" id="settingsBtn">⚙</button>
</header>

<main id="home">
  <section class="balance">
    <div class="caption">CURRENT BALANCE</div>
    <div class="amount" id="balance">₹5,000</div>
    <div class="cycleline">Cycle <b id="cycle">1</b> · <b id="status">Stopped</b></div>
  </section>

  <section class="infoGrid">
    <div><span>🎯 Peak / Target</span><b id="peak">₹5,000</b></div>
    <div><span>🛑 Stop Loss</span><b id="stop">₹250</b></div>
    <div><span>⚡ Safety Cap</span><b id="cap">₹100</b></div>
    <div><span>📈 Progress</span><b id="progressText">0%</b></div>
  </section>

  <section class="stats">
    <div><span>Highest</span><b id="highest">₹5,000</b></div>
    <div><span>Profit</span><b id="profit">₹0</b></div>
    <div><span>Loss</span><b id="loss">₹0</b></div>
  </section>

  <div class="progress"><i id="bar"></i></div>

  <section class="cycleBtns">
    <button class="start" id="startBtn">▶ Start Cycle</button>
    <button class="stop" id="stopBtn">■ Stop Cycle</button>
  </section>

  <section class="quick">
    <div class="label">QUICK RESULT</div>
    <div class="resultGrid">
      <button data-amt="100">+100</button><button data-amt="200">+200</button><button data-amt="500">+500</button>
      <button data-amt="-100">−100</button><button data-amt="-200">−200</button><button data-amt="-500">−500</button>
    </div>
  </section>

  <section class="homeTools">
    <button id="historyBtn">📜 <span>History</span></button>
    <button id="reportBtn">📊 <span>Report</span></button>
    <button id="moreBtn">☷ <span>More</span></button>
  </section>

  <section class="hint">
    <span>Cycle control</span>
    <b>Target = Peak</b>
    <small>Safety cap: 1% balance, rounded up to ₹100</small>
  </section>
</main>

<div class="modal hidden" id="modal">
 <div class="modalBox">
  <div class="modalHead"><b id="modalTitle">Details</b><button id="closeModal">×</button></div>
  <div id="modalBody"></div>
 </div>
</div>

<script src="assets/js/app.js"></script>
</body>
</html>
