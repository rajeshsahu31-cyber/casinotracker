<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07182c">
<title>Cycle Tracker</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#07182c;color:#f8fafc;font-family:Arial,Helvetica,sans-serif}
button,input{font-family:inherit}
#app{height:100dvh;width:100%;display:flex;flex-direction:column;overflow:hidden}
header{height:52px;flex:0 0 52px;display:grid;grid-template-columns:42px 1fr 42px;align-items:center;padding:5px 10px;border-bottom:1px solid #263b52}
.top{width:38px;height:36px;border:1px solid #52708c;border-radius:8px;background:#10263e;color:#fff;font-size:19px}
.head{text-align:center;line-height:1.05;white-space:nowrap;overflow:hidden}
.head b{font-size:17px}.head small{display:block;color:#9db1c5;font-size:9px;margin-top:2px}
#home{flex:1;min-height:0;display:grid;grid-template-rows:auto auto auto 5px auto auto auto auto;gap:5px;padding:6px 10px 7px;overflow:hidden}
.balance{border:1px solid #00a8ff;border-radius:18px;background:linear-gradient(135deg,#00a943,#00d45f);padding:8px 15px;display:flex;flex-direction:column;justify-content:center;min-height:74px}
.cap{font-size:9px;font-weight:800;letter-spacing:.7px}.bal{font-size:26px;font-weight:900;line-height:1.05}.cycle{font-size:10px;margin-top:2px}
.info{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.info div{height:32px;border:1px solid #078fe0;border-radius:12px;background:#09233d;padding:4px 7px;display:flex;align-items:center;justify-content:space-between;min-width:0}
.info span{font-size:9px;white-space:nowrap}.info b{font-size:11px;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.stats div{height:40px;background:#12253a;border:1px solid #2b455f;border-radius:9px;text-align:center;padding:4px}
.stats span{display:block;font-size:8px;color:#9db1c5}.stats b{font-size:12px}
.progress{height:5px;border-radius:8px;background:#18324b;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#20cf68}
.cycles{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.cycles button{height:34px;border:0;border-radius:8px;color:white;font-size:12px;font-weight:800}
.start{background:#15ad56}.stop{background:#d83c48}
.quick .qtitle{font-size:8px;color:#9db1c5;font-weight:800;margin:0 0 3px 2px}
.results{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.results button{height:29px;border:1px solid #45647f;border-radius:6px;background:#112941;color:#fff;font-size:9px;font-weight:800}
.tools{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.tools button{height:34px;border:1px solid #45647f;border-radius:8px;background:#112941;color:#fff;font-size:10px;font-weight:800}
.note{border:1px solid #294965;border-radius:8px;background:#0b2037;padding:5px 8px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 6px}
.note span{font-size:8px;color:#9db1c5}.note b{font-size:8px}.note small{grid-column:1/-1;font-size:7px;color:#7891a7}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;z-index:20}
.hide{display:none!important}
.sheet{width:100%;background:#0c2037;border:1px solid #3a5872;border-radius:16px 16px 0 0;padding:9px;max-height:78dvh;overflow:auto}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.mhead b{font-size:14px}.x{width:31px;height:29px;border:1px solid #52708c;border-radius:6px;background:#152d46;color:#fff;font-size:19px}
.row{padding:6px 2px;border-bottom:1px solid #29445d;font-size:10px;line-height:1.35}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:7px}
.mgrid button{height:34px;border:1px solid #45647f;border-radius:7px;background:#152d46;color:#fff;font-size:10px;font-weight:800}
.mgrid .danger{background:#55212a;border-color:#a34a55}
.calc{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}.calc input,.calc button{height:31px;border:1px solid #45647f;border-radius:6px;background:#07182c;color:#fff;padding:4px;font-size:9px}.calc button{background:#1769d1;font-weight:800}
.calcOut{text-align:center;font-size:10px;margin-top:6px}
@media(max-height:650px){
header{height:44px;flex-basis:44px}
.top{height:31px;width:34px;font-size:17px}
#home{gap:3px;padding:4px 8px 5px}
.balance{min-height:63px;padding:5px 12px}.bal{font-size:22px}
.info div{height:28px}.stats div{height:34px}.cycles button{height:30px}.results button{height:25px}.tools button{height:29px}.note{padding:3px 6px}
}
</style>
</head>
<body>
<div id="app">
<header>
<button class="top" id="menu">☰</button>
<div class="head"><b>Cycle Tracker</b><small>Quick Dashboard</small></div>
<button class="top" id="settings">⚙</button>
</header>

<main id="home">
<section class="balance">
<div class="cap">CURRENT BALANCE</div>
<div class="bal" id="balance">₹5,000</div>
<div class="cycle">Cycle <b id="cycle">1</b> · <b id="status">Stopped</b></div>
</section>

<section class="info">
<div><span>🎯 Peak / Target</span><b id="peak">₹5,000</b></div>
<div><span>🛑 Stop Loss</span><b id="stop">₹250</b></div>
<div><span>⚡ Safety Cap</span><b id="safety">₹100</b></div>
<div><span>📈 Progress</span><b id="pct">0%</b></div>
</section>

<section class="stats">
<div><span>Highest</span><b id="highest">₹5,000</b></div>
<div><span>Profit</span><b id="profit">₹0</b></div>
<div><span>Loss</span><b id="loss">₹0</b></div>
</section>

<div class="progress"><i id="bar"></i></div>

<section class="cycles">
<button class="start" id="start">▶ Start Cycle</button>
<button class="stop" id="stopBtn">■ Stop Cycle</button>
</section>

<section class="quick">
<div class="qtitle">QUICK RESULT</div>
<div class="results">
<button data-a="100">+100</button><button data-a="200">+200</button><button data-a="500">+500</button>
<button data-a="-100">−100</button><button data-a="-200">−200</button><button data-a="-500">−500</button>
</div>
</section>

<section class="tools">
<button id="history">📜 History</button>
<button id="report">📊 Report</button>
<button id="more">☷ More</button>
</section>

<section class="note">
<span>Cycle control</span><b>Target = Peak</b>
<small>Safety cap = balance का 1%, अगले ₹100 पर round up</small>
</section>
</main>
</div>

<div class="modal hide" id="modal"><div class="sheet">
<div class="mhead"><b id="mtitle">Details</b><button class="x" id="close">×</button></div>
<div id="mbody"></div>
</div></div>

<script>
const KEY='cycle_tracker_single_v1';
const DEF={balance:5000,peak:5000,cycle:1,running:false,startBalance:5000,profit:0,loss:0,history:[],stopRate:5,reminder:null,cooldownUntil:null};
let s=JSON.parse(localStorage.getItem(KEY)||'null')||JSON.parse(JSON.stringify(DEF));
const $=x=>document.getElementById(x);
const rupee=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const safety=()=>Math.max(100,Math.ceil((s.balance*.01)/100)*100);
const stopLoss=()=>s.startBalance*s.stopRate/100;
function save(){localStorage.setItem(KEY,JSON.stringify(s));draw()}
function draw(){
 $('balance').textContent=rupee(s.balance);$('peak').textContent=rupee(s.peak);$('highest').textContent=rupee(s.peak);
 $('cycle').textContent=s.cycle;$('status').textContent=s.running?'Running':'Stopped';
 $('stop').textContent=rupee(stopLoss());$('safety').textContent=rupee(safety());
 $('profit').textContent=rupee(s.profit);$('loss').textContent=rupee(s.loss);
 let d=Math.max(1,s.peak-s.startBalance),p=Math.max(0,Math.min(100,(s.balance-s.startBalance)/d*100));
 $('pct').textContent=Math.round(p)+'%';$('bar').style.width=p+'%';
}
function show(t,h){$('mtitle').textContent=t;$('mbody').innerHTML=h;$('modal').classList.remove('hide')}
function hide(){ $('modal').classList.add('hide') }
function startCycle(){
 if(s.running)return alert('Cycle पहले से चालू है।');
 s.running=true;s.startBalance=s.balance;s.profit=0;s.loss=0;save()
}
function finish(reason){
 s.running=false;
 s.history.unshift({cycle:s.cycle,date:new Date().toLocaleString('hi-IN'),start:s.startBalance,end:s.balance,profit:s.profit,loss:s.loss,reason});
 s.cycle++;save();
 show('Cycle समाप्त',`<div class="row">${reason}</div><div class="row">Balance: <b>${rupee(s.balance)}</b></div><div class="row">Peak / Target: <b>${rupee(s.peak)}</b></div>`)
}
function add(a){
 if(!s.running)return alert('पहले Start Cycle दबाइए।');
 if(Math.abs(a)>safety())return alert('Safety Cap '+rupee(safety())+' है।');
 s.balance=Math.max(0,s.balance+a);
 if(a>0)s.profit+=a;else s.loss+=Math.abs(a);
 if(s.balance>s.peak){s.peak=s.balance;finish('🎯 नया Peak प्राप्त हुआ। यही अगला Target है।');return}
 if(s.loss>=stopLoss()){finish('🛑 Stop Loss सीमा पूरी हुई।');return}
 save()
}
function history(){
 if(!s.history.length)return show('History','<div class="row">अभी कोई completed cycle नहीं है।</div>');
 show('History',s.history.map(h=>`<div class="row"><b>Cycle ${h.cycle}</b> · ${h.date}<br>${rupee(h.start)} → ${rupee(h.end)} · Profit ${rupee(h.profit)} · Loss ${rupee(h.loss)}<br>${h.reason}</div>`).join(''))
}
function report(){show('Report',`<div class="row">Completed Cycles: <b>${s.history.length}</b></div><div class="row">Highest Peak: <b>${rupee(s.peak)}</b></div><div class="row">Current Balance: <b>${rupee(s.balance)}</b></div><div class="row">Current Profit: <b>${rupee(s.profit)}</b></div><div class="row">Current Loss: <b>${rupee(s.loss)}</b></div>`)}
function more(){
show('More',`<div class="mgrid">
<button id="calc">🧮 Calculator</button><button id="cool">⏳ Cooldown</button>
<button id="rem">🔔 Reminder</button><button id="set2">⚙ Settings</button>
<button class="danger" id="clear">🗑️ Clear History</button><button class="danger" id="reset">♻️ Reset App</button>
</div>`);
$('calc').onclick=calculator;$('cool').onclick=()=>{s.cooldownUntil=Date.now()+86400000;save();hide();alert('24 घंटे का cooldown सेट किया गया।')};
$('rem').onclick=()=>{let v=prompt('Reminder का समय लिखें:',s.reminder||'');if(v!==null){s.reminder=v;save();alert('Reminder सेव हो गया।')}};
$('set2').onclick=settings;
$('clear').onclick=()=>{if(confirm('सिर्फ History clear करें? Balance और Peak सुरक्षित रहेंगे।')){s.history=[];save();hide()}};
$('reset').onclick=()=>{if(confirm('पूरा App Reset करें?')){localStorage.removeItem(KEY);location.reload()}}
}
function calculator(){
show('Compounding Calculator',`<div class="calc"><input id="ca" type="number" value="5000"><input id="cr" type="number" value="5"><input id="cn" type="number" value="10"><button id="doCalc">Calculate</button></div><div class="calcOut" id="co">—</div>`);
$('doCalc').onclick=()=>{let a=+$('ca').value||0,r=(+$('cr').value||0)/100,n=+$('cn').value||0;$('co').textContent=rupee(a*Math.pow(1+r,n))}
}
function settings(){
show('Settings',`<div class="row">Stop Loss %<br><input id="sr" type="number" value="${s.stopRate}" style="width:100%;height:32px;margin-top:5px;background:#07182c;color:#fff;border:1px solid #45647f;border-radius:6px;padding:5px"></div><div class="mgrid"><button id="saveSet">Save</button></div>`);
$('saveSet').onclick=()=>{s.stopRate=+$('sr').value||5;save();hide()}
}
$('start').onclick=startCycle;
$('stopBtn').onclick=()=>{if(s.running)finish('Cycle manually stopped.');else alert('Cycle चल नहीं रहा है।')};
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>add(+b.dataset.a));
$('history').onclick=history;$('report').onclick=report;$('more').onclick=more;$('settings').onclick=settings;
$('menu').onclick=()=>show('About','<div class="row">यह एक local manual tracker है। इसमें login, backend या किसी gaming platform का connection नहीं है। Data इसी browser/device में रहता है।</div>');
$('close').onclick=hide;$('modal').onclick=e=>{if(e.target.id==='modal')hide()};
draw();
</script>
</body>
</html>
